name: DeepSeekBalance
options:
  bundleIdPrefix: com.qweq-1
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  DeepSeekBalance:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepSeekBalance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.deepseekbalance
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "DeepSeek 余额"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"

  DeepSeekBalanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepSeekBalanceTests
    dependencies:
      - target: DeepSeekBalance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.deepseekbalance.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DeepSeekBalance.app/DeepSeekBalance"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DeepSeekBalance:
    build:
      targets:
        DeepSeekBalance: all
        DeepSeekBalanceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeepSeekBalanceTests
